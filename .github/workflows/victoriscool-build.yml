name: Build VictorIsCool clients
run-name: Build VictorIsCool clients (${{ inputs.upload_tag }})

# This release workflow is intentionally manual. The repository already runs
# its regular CI and Full Flutter CI workflows on pushes and pull requests.
# Starting the complete multi-platform matrix again on every release-branch
# push creates duplicate Windows, Linux, macOS and Android jobs and can exhaust
# GitHub-hosted runner retries.
on:
  workflow_dispatch:
    inputs:
      upload_tag:
        description: Artifact/release tag label
        required: true
        default: victoriscool-1.0.0
        type: string

# Keep only one release build per branch. Starting a newer manual build cancels
# an older stale run instead of running two complete platform matrices at once.
concurrency:
  group: victoriscool-client-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

# The reusable build workflow creates a GitHub Release and uploads the finished
# platform packages. Reusable workflows cannot elevate the caller token, so
# contents write access must be granted here.
permissions:
  contents: write
  actions: write

jobs:
  build-clients:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload_tag }}
    secrets: inherit
